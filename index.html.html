<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Flying Lucky</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120a05;--ink:#fff6e0;--amber:#ffb627;--red:#e63946;--panel:rgba(20,10,4,.86)}
:root[data-theme="dark"],:root:not([data-theme="light"]){--bg:#120a05}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;height:100%;max-width:100%;aspect-ratio:9/16;background:#000}
.ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.hud{position:absolute;top:max(14px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:18px;pointer-events:none;font-family:Bungee;text-shadow:0 3px 0 #000}
.hud div{background:var(--panel);border:2px solid var(--amber);border-radius:12px;padding:4px 14px;font-size:15px}
.hud b{font-size:22px;color:var(--amber);margin-left:6px}
.card{pointer-events:auto;width:min(92vw,360px);background:var(--panel);border:3px solid var(--amber);border-radius:22px;padding:22px 18px;text-align:center;box-shadow:0 10px 0 #000,0 0 60px rgba(255,182,39,.25)}
h1{font-family:Bungee;font-size:clamp(30px,9vw,40px);line-height:1;color:var(--amber);text-shadow:0 4px 0 #6b2c00}
.tag{margin:6px 0 14px;font-weight:800;font-size:17px;opacity:.9}
.face{width:120px;height:120px;border-radius:50%;border:4px solid var(--amber);object-fit:cover;margin:4px auto 12px;display:block;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px) rotate(-6deg)}}
button{font-family:Bungee;font-size:16px;border:0;border-radius:14px;padding:14px 16px;width:100%;cursor:pointer;background:var(--amber);color:#2a1200;box-shadow:0 5px 0 #8a4b00;transition:transform .08s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #8a4b00}
.ctr{margin-top:14px;font-size:14px;opacity:.85;line-height:1.5}
.fail{font-family:Bungee;font-size:40px;color:var(--red);text-shadow:0 4px 0 #000;animation:shake .4s 2}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.angry{width:150px;height:160px;object-fit:cover;border-radius:16px;border:4px solid var(--red);margin:10px auto;display:block;filter:saturate(1.6) contrast(1.1) sepia(.3) hue-rotate(-20deg)}
.scores{display:flex;justify-content:center;gap:12px;margin:6px 0 14px;font-family:Bungee}
.scores div{background:#000;border-radius:10px;padding:6px 14px}
.scores b{display:block;font-size:26px;color:var(--amber)}
.rec{color:#7CFC00;font-family:Bungee;margin-bottom:6px;display:none;animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}
.insult{font-weight:800;margin-bottom:12px}
#mute{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));pointer-events:auto;width:48px;height:48px;padding:0;font-size:22px;border-radius:50%;box-shadow:0 4px 0 #8a4b00}
.hide{display:none!important}
</style>
</head>

const voice=$('voice');
let muted=false,best=0;
try{best=+localStorage.getItem('fb_best')||0}catch(e){}
$('bs').textContent=best;

let AC;function beep(f1,f2,d,type='square',v=.08){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,AC.currentTime);o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

const GAP=210,BW=96,SPEED=2.9,GRAV=.42,FLAP=-7.6;
let state='start',bird,pipes,score,frame,groundX=0,stars=[];
for(let i=0;i<60;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.6,r:Math.random()*1.6+.3,t:Math.random()*6});
// city skyline
const sky=[];for(let i=0,px=0;px<W*2;i++){const w=30+Math.random()*50,h=80+Math.random()*180;sky.push({x:px,w,h,win:Math.random()});px+=w+4}

function reset(){bird={x:120,y:H/2-60,vy:0,r:30,rot:0};pipes=[];score=0;frame=0;$('sc').textContent=0}
reset();

function flap(){
  if(state==='start'){start();return}
  if(state!=='play')return;
  bird.vy=FLAP;beep(520,880,.12,'square',.05);
}
function start(){reset();state='play';$('start').classList.add('hide');$('over').classList.add('hide');$('hud').classList.remove('hide');try{voice.pause();voice.currentTime=0}catch(e){};bird.vy=FLAP}
function die(){
  if(state!=='play')return;state='dead';
  beep(300,60,.5,'sawtooth',.1);
  if(!muted){try{voice.currentTime=0;voice.play().catch(()=>{})}catch(e){}}
  const nr=score>best;if(nr){best=score;try{localStorage.setItem('fb_best',best)}catch(e){}}
  $('bs').textContent=best;$('fs').textContent=score;$('fb').textContent=best;
  $('rec').style.display=nr&&score>0?'block':'none';
  setTimeout(()=>{$('over').classList.remove('hide');$('hud').classList.add('hide')},650);
}

// --- Drawing a generic strong-beer bottle (body height h, flipped if top) ---
function bottle(px,top,bottomEdge,flip){
  // draws a bottle occupying from y=top to y=bottomEdge; neck points toward the gap
  x.save();
  const len=bottomEdge-top;
  if(flip){x.translate(px+BW/2,bottomEdge);x.scale(1,-1)}else{x.translate(px+BW/2,top)}
  // in local coords: y=0 is the gap edge (cap), extends to len
  const neckLen=70,shoulder=34,cap=14,nw=26,bw=BW/2;
  // glass gradient
  const g=x.createLinearGradient(-bw,0,bw,0);
  g.addColorStop(0,'#3a1a02');g.addColorStop(.25,'#8a4510');g.addColorStop(.45,'#c8701e');g.addColorStop(.6,'#7a3a0a');g.addColorStop(1,'#2a1000');
  x.fillStyle=g;x.strokeStyle='#160800';x.lineWidth=3;
  x.beginPath();
  x.moveTo(-nw/2,cap);x.lineTo(-nw/2,cap+neckLen);
  x.quadraticCurveTo(-bw,cap+neckLen+6,-bw,cap+neckLen+shoulder);
  x.lineTo(-bw,len+40);x.lineTo(bw,len+40);x.lineTo(bw,cap+neckLen+shoulder);
  x.quadraticCurveTo(bw,cap+neckLen+6,nw/2,cap+neckLen);x.lineTo(nw/2,cap);x.closePath();x.fill();x.stroke();
  // cap (crown)
  x.fillStyle='#d4a017';x.beginPath();x.rect(-nw/2-4,0,nw+8,cap);x.fill();x.stroke();
  x.fillStyle='#8a6a00';for(let i=-nw/2-2;i<nw/2+4;i+=6)x.fillRect(i,cap-4,3,4);
  // neck foil label
  x.fillStyle='#b8001f';x.fillRect(-nw/2,cap+18,nw,22);x.strokeRect(-nw/2,cap+18,nw,22);
  // main label
  const ly=cap+neckLen+shoulder+16,lh=Math.min(130,len-ly-10);
  if(lh>50){
    x.fillStyle='#c8102e';x.fillRect(-bw+4,ly,BW-8,lh);
    x.strokeStyle='#ffd23f';x.lineWidth=3;x.strokeRect(-bw+8,ly+4,BW-16,lh-8);
    x.save();if(flip){x.translate(0,ly+lh/2);x.scale(1,-1);x.translate(0,-(ly+lh/2))}
    x.fillStyle='#ffd23f';x.textAlign='center';
    x.font='18px Bungee, sans-serif';x.fillText('STRONG',0,ly+lh/2-4);
    x.font='bold 12px "Baloo 2", sans-serif';x.fillStyle='#fff';x.fillText('PREMIUM BEER',0,ly+lh/2+14);
    x.font='10px "Baloo 2", sans-serif';x.fillText('8% ALC',0,ly+lh/2+28);
    x.restore();
  }
  // shine
  x.fillStyle='rgba(255,230,180,.25)';x.fillRect(-bw+10,cap+neckLen+shoulder,8,len);
  x.fillRect(-nw/2+4,cap+4,4,neckLen);
  x.restore();
}

function drawBG(){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0620');g.addColorStop(.6,'#3a1640');g.addColorStop(1,'#a3361e');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  for(const s of stars){x.globalAlpha=.4+.6*Math.abs(Math.sin(s.t+frame*.03));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}
  x.globalAlpha=1;
  // moon
  x.fillStyle='#ffe9a8';x.beginPath();x.arc(360,110,34,0,7);x.fill();x.fillStyle='#0b0620';x.beginPath();x.arc(374,100,30,0,7);x.fill();
  // skyline parallax
  const off=(frame*.6)%(W*2);
  for(const b of sky){let bx=b.x-off;if(bx<-b.w)bx+=W*2;
    x.fillStyle='#1a0b1e';x.fillRect(bx,H-90-b.h,b.w,b.h);
    x.fillStyle='rgba(255,190,60,.55)';for(let wy=H-80-b.h;wy<H-100;wy+=16)for(let wx=bx+5;wx<bx+b.w-8;wx+=12)if(((wx*7+wy*3)|0)%5<2)x.fillRect(wx,wy,5,7)}
}
function drawGround(){
  x.fillStyle='#3b1f0e';x.fillRect(0,H-90,W,90);
  x.fillStyle='#6b3a1a';x.fillRect(0,H-90,W,12);
  x.fillStyle='#2a1508';for(let i=-1;i<W/40+2;i++)x.fillRect(i*40-groundX,H-78,20,78);
}
function drawBird(){
  x.save();x.translate(bird.x,bird.y);x.rotate(bird.rot);
  x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.arc(3,5,bird.r+3,0,7);x.fill();
  x.save();x.beginPath();x.arc(0,0,bird.r,0,7);x.clip();
  if(face.complete)x.drawImage(face,-bird.r,-bird.r,bird.r*2,bird.r*2);x.restore();
  x.strokeStyle='#ffb627';x.lineWidth=4;x.beginPath();x.arc(0,0,bird.r,0,7);x.stroke();
  // little wings
  const fl=Math.sin(frame*.5)*8;
  x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=2;
  x.beginPath();x.ellipse(-bird.r-6,4,12,7+fl*.3,-.5,0,7);x.fill();x.stroke();
  x.restore();
}

function update(){
  frame++;
  if(state==='play'||state==='dead'){
    bird.vy+=GRAV;bird.y+=bird.vy;
    bird.rot=Math.max(-.45,Math.min(1.3,bird.vy*.07));
    if(bird.y+bird.r>H-90){bird.y=H-90-bird.r;bird.vy=0;die()}
    if(bird.y-bird.r<0){bird.y=bird.r;bird.vy=0}
  }
  if(state==='play'){
    groundX=(groundX+SPEED)%40;
    const sp=SPEED+Math.min(score*.05,1.8);
    if(frame%Math.round(100/ (sp/SPEED))===0||pipes.length===0&&frame>30){
      const gap=Math.max(160,GAP-score*2);
      const gy=120+Math.random()*(H-90-240-gap);
      pipes.push({x:W+10,gy,gap,passed:false});
    }
    for(const p of pipes){
      p.x-=sp;
      if(!p.passed&&p.x+BW<bird.x){p.passed=true;score++;$('sc').textContent=score;beep(880,1320,.15,'triangle',.07)}
      // collision with bottle rectangles (slightly forgiving)
      const r=bird.r-6,inX=bird.x+r>p.x+8&&bird.x-r<p.x+BW-8;
      if(inX&&(bird.y-r<p.gy||bird.y+r>p.gy+p.gap))die();
    }
    pipes=pipes.filter(p=>p.x>-BW-20);
  }else if(state==='start'){bird.y=H/2-60+Math.sin(frame*.06)*14;groundX=(groundX+1.5)%40}
}
function draw(){
  drawBG();
  for(const p of pipes){bottle(p.x,0,p.gy,true);bottle(p.x,p.gy+p.gap,H-90,false)}
  drawGround();drawBird();
  if(state==='play'){x.font='64px Bungee, sans-serif';x.textAlign='center';x.fillStyle='#000';x.fillText(score,W/2+3,170+4);x.fillStyle='#ffb627';x.fillText(score,W/2,170)}
}
function loop(){update();draw();requestAnimationFrame(loop)}
loop();

$('play').onclick=e=>{e.stopPropagation();start()};
$('again').onclick=e=>{e.stopPropagation();start()};
$('mute').onclick=e=>{e.stopPropagation();muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(muted){try{voice.pause()}catch(e){}}};
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(state==='dead'&&!$('over').classList.contains('hide'))start();else flap()}});
</script>
